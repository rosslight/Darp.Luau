name: Build and test .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # The SDK in global.json brings the .NET 11 runtime only; the tests also run on .NET 10.
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        # Without filters coverlet leaves out every assembly the test process has loaded already, Darp.Luau among them
        run: |
          dotnet test --no-build --no-progress --results-directory ./coverage-results \
            --coverlet --coverlet-output-format cobertura \
            --coverlet-include "[Darp.Luau]*" --coverlet-include "[Darp.Luau.Generator]*" \
            --coverlet-exclude "[*.Tests]*"

      - name: Attach code-coverage comment
        uses: rosslight/pr-code-coverage-visualizer@v2.2.0
        with:
          files: |
            coverage-results/coverage.cobertura.*.xml
          update-comment: true
          show-changed-lines-only: true

      - name: Test with Native AOT
        run: |
          for framework in net10.0 net11.0; do
            dotnet publish tests/Darp.Luau.Tests/Darp.Luau.Tests.csproj -c Release -f $framework -r linux-x64 -o ./artifacts/native-aot-tests/$framework /warnaserror
            ./artifacts/native-aot-tests/$framework/Darp.Luau.Tests
          done

  warnings-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # The SDK in global.json brings the .NET 11 runtime only; the tests also run on .NET 10.
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Build warning-free Debug
        run: dotnet build "Darp.Lua.Net.slnx" -c Debug /warnaserror
      - name: Build warning-free Release
        run: dotnet build "Darp.Lua.Net.slnx" -c Release /warnaserror

  test-other-platforms:
    strategy:
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            rid: win-x64
          - name: Windows arm64
            os: windows-11-arm
            rid: win-arm64
          - name: macOS x64
            os: macos-26-intel
            rid: osx-x64
          - name: macOS arm64
            os: macos-26
            rid: osx-arm64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            rid: linux-arm64

    name: Test on ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: git configure long path
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          # The SDK in global.json brings the .NET 11 runtime only; the tests also run on .NET 10.
          dotnet-version: 10.0.x
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test generators
        run: dotnet test --project tests/Darp.Luau.Generator.Tests/Darp.Luau.Generator.Tests.csproj --no-build --no-progress
      - name: Test with Native AOT
        shell: bash
        run: |
          for framework in net10.0 net11.0; do
            dotnet publish tests/Darp.Luau.Tests/Darp.Luau.Tests.csproj -c Release -f $framework -r ${{ matrix.rid }} -o ./artifacts/native-aot-tests/$framework /warnaserror
            ./artifacts/native-aot-tests/$framework/Darp.Luau.Tests${{ runner.os == 'Windows' && '.exe' || '' }}
          done
